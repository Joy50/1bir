<div class="col-12">
  <div class="small text-secondary text-uppercase">{{ title }}</div>
  <div class="row g-2 mt-1">
    <div class="col-md-6 col-lg-3">
      <div class="small text-secondary">District</div>
      <div>{{ district|default:"—" }}</div>
    </div>
    <div class="col-md-6 col-lg-3">
      <div class="small text-secondary">Upazila</div>
      <div>{{ upazila|default:"—" }}</div>
    </div>
    <div class="col-md-6 col-lg-3">
      <div class="small text-secondary">Thana</div>
      <div>{{ thana|default:"—" }}</div>
    </div>
    <div class="col-12">
      <div class="small text-secondary">Area/Road/House</div>
      <div>{{ area_road_house|default:"—" }}</div>
    </div>
  </div>
</div>
